<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KORA Culture Explorer</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/cultures.css">

</head>

<body>

<nav class="navbar">

<div class="logo">
🌏 KORA
</div>

<ul class="nav-links">
<li><a href="home.html">Home</a></li>
<li><a href="cultures.html">Cultures</a></li>
<li><a href="ayurveda.html">Ayurveda</a></li>
<li><a href="consult.html">Consultation</a></li>
<li><a href="ask.html">Ask KORA</a></li>
</ul>

</nav>

<section class="culture-hero">

<div>

<h1>Explore World Cultures</h1>

<p>
Discover traditions, etiquette, festivals, food histories,
recipes, and fascinating facts from around the world.
</p>

</div>

</section>

<section class="search-section">

<div class="container">

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search cultures or countries...">

</div>

</div>

</section>

<section>

<div class="container">

<div
class="culture-grid"
id="cultureCards">

</div>

</div>

</section>

<script>

let allCultures = [];

fetch("cultures.json")

.then(response => {

if(!response.ok){

throw new Error(
"Unable to load cultures.json"
);

}

return response.json();

})

.then(data => {

allCultures = data;

displayCultures(data);

})

.catch(error => {

document.getElementById(
"cultureCards"
).innerHTML =

"<h2 style='text-align:center;'>Failed to load cultures.</h2>";

console.error(error);

});

function displayCultures(cultures){

const container =
document.getElementById(
"cultureCards"
);

container.innerHTML = "";

cultures.forEach(culture => {

const card =
document.createElement("div");

card.className =
"culture-card";

card.innerHTML =

`
<img
src="${culture.imageUrl}"
alt="${culture.name}">

<div class="culture-content">

<span class="country">
${culture.country}
</span>

<span class="category">
${culture.category[0]}
</span>

<h3>
${culture.name}
</h3>

<p>
${culture.stories[0]}
</p>

<div class="detail-box">

<h4>🍽 Food History</h4>

<p>
${culture.foodHistory}
</p>

</div>

<div class="detail-box">

<h4>📖 Recipes</h4>

<p>
${culture.recipes.join(", ")}
</p>

</div>

<div class="detail-box">

<h4>💡 Interesting Fact</h4>

<p>
${culture.facts[0]}
</p>

</div>

<a
href="culture.html?name=${encodeURIComponent(culture.name)}"
class="btn">

Learn More

</a>

</div>

`;

container.appendChild(card);

});

}

document
.getElementById("searchInput")
.addEventListener("input", function(){

const search =
this.value.toLowerCase();

const filtered =
allCultures.filter(culture =>

culture.name
.toLowerCase()
.includes(search)

||

culture.country
.toLowerCase()
.includes(search)

);

displayCultures(filtered);

});

</script>

</body>

</html>
