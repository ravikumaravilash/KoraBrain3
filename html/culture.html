<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Culture Detail</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/culture.css">

</head>

<body>

<div id="culturePage">

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const cultureName =
params.get("name");

fetch("cultures.json")

.then(res=>res.json())

.then(data=>{

const culture =
data.find(c=>

c.name.toLowerCase() ===
cultureName.toLowerCase()

);

if(!culture){

document.getElementById("culturePage")
.innerHTML =
"<h1>Culture Not Found</h1>";

return;

}

document.getElementById("culturePage")
.innerHTML =

`

<section
class="culture-banner"

style="
background-image:
url('${culture.imageUrl}');
">

<div class="banner-content">

<span class="badge country-badge">

${culture.country}

</span>

<span class="badge category-badge">

${culture.category[0]}

</span>

<h1>

${culture.name}

</h1>

<button
class="speak-btn"
onclick="speakCulture()">

🔊 Listen with KORA

</button>

</div>

</section>

<section class="detail-section">

<div class="container">

<div class="detail-card">

<h2>📖 Story</h2>

<p>

${culture.stories.join("<br><br>")}

</p>

</div>

<div class="detail-card">

<h2>🤝 Etiquette</h2>

<ul>

${culture.etiquette.map(

e=>`<li>${e}</li>`

).join("")}

</ul>

</div>

<div class="detail-card">

<h2>🍜 Food History</h2>

<p>

${culture.foodHistory}

</p>

</div>

<div class="detail-card">

<h2>🍲 Traditional Recipes</h2>

<ul>

${culture.recipes.map(

r=>`<li>${r}</li>`

).join("")}

</ul>

</div>

<div class="detail-card">

<h2>💡 Fun Facts</h2>

<ul>

${culture.facts.map(

f=>`<li>${f}</li>`

).join("")}

</ul>

</div>

<div class="center">

<a href="cultures.html"
class="back-btn">

← Back to Culture Explorer

</a>

</div>

</div>

</section>

`;

window.currentCulture = culture;

});

function speakCulture(){

const text =

currentCulture.name +

". " +

currentCulture.stories.join(" ");

const utterance =
new SpeechSynthesisUtterance(text);

speechSynthesis.speak(utterance);

}

</script>

</body>
</html>
