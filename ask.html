<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Ask KORA</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/ask.css">

</head>

<body>

<section class="ask-hero">

<div>

<h1>💬 Ask KORA</h1>

<p>

Your AI-powered cultural
and wellness assistant.

</p>

</div>

</section>

<div class="chat-container">

<div class="chat-header">

🤖 KORA Assistant Online

</div>

<div class="quick-actions">

<button
class="quick-btn"
onclick="quickQuestion('Tell me about Ayurveda')">

Ayurveda

</button>

<button
class="quick-btn"
onclick="quickQuestion('Tell me about India')">

India

</button>

<button
class="quick-btn"
onclick="quickQuestion('Healthy remedies')">

Remedies

</button>

<button
class="quick-btn"
onclick="quickQuestion('Explain Diwali')">

Diwali

</button>

</div>

<div
id="chatMessages"
class="chat-messages">

<div class="message bot">

Hello 👋

I am KORA.

Ask me anything about
cultures, traditions,
Ayurveda or wellness.

</div>

</div>

<div class="chat-input">

<input
id="userInput"
type="text"
placeholder="Ask KORA...">

<button onclick="sendMessage()">

Send

</button>

</div>

</div>

<script src="js/ask.js"></script>

</body>

</html>
