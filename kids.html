<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>KORA Kids Mode</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/kids.css">

</head>

<body>

<section class="kids-hero">

<div>

<h1>🎉 KORA Kids Mode</h1>

<p>

Learn cultures through fun stories,
voice narration and quizzes.

</p>

</div>

</section>

<section class="story-section">

<div class="story-card">

<div class="kora-avatar">

<img src="images/kora-kids.png">

</div>

<h2>KORA Story Time</h2>

<div
id="storyText"
class="story-text">

Welcome! Let's learn about Diwali.

</div>

<div class="story-buttons">

<button
class="story-btn voice-btn"
onclick="speakStory()">

🔊 Read Story

</button>

<button
class="story-btn next-btn"
onclick="nextStory()">

Next ➜

</button>

</div>

</div>

</section>

<section class="quiz-section">

<div class="quiz-card">

<h2>🌟 Quick Quiz</h2>

<p>

What is Diwali known as?

</p>

<button
class="quiz-option"
onclick="checkAnswer(false)">

Festival of Colors

</button>

<button
class="quiz-option"
onclick="checkAnswer(true)">

Festival of Lights

</button>

<button
class="quiz-option"
onclick="checkAnswer(false)">

Harvest Festival

</button>

<p id="quizResult"></p>

</div>

</section>

<section class="badge-section">

<div class="container">

<div class="badge-grid">

<div class="badge-card">

<h2>🥉</h2>

<h3>Explorer Badge</h3>

</div>

<div class="badge-card">

<h2>🥈</h2>

<h3>Culture Expert</h3>

</div>

<div class="badge-card">

<h2>🥇</h2>

<h3>KORA Master</h3>

</div>

</div>

</div>

</section>

<script src="js/kids.js"></script>

</body>
</html>
